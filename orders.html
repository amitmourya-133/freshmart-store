<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshMart - My Orders</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body data-page="orders">

    <a class="skip-link" href="#main-content">Skip to content</a><header>

        <div class="logo">
            🥬 FreshMart
        </div>

        <div class="header-actions">
            <button
                type="button"
                class="secondary-btn hide-on-mobile-nav"
                onclick="window.location.href='index.html'"
            >
                🏠 Home
            </button>
            <div class="auth-area" id="authArea"></div>
            <button
                type="button"
                class="dark-mode-toggle"
                id="darkModeToggle"
                onclick="toggleDarkMode()"
                title="Toggle Dark Mode" aria-label="Toggle dark mode"
            >
                🌙
            </button>
        </div>

    </header>


    <section class="orders-page" id="main-content">

        <h1>📦 My Orders</h1>

        <div class="track-box">
            <h2>Track an order</h2>
            <div class="track-row">
                <input
                    type="text"
                    id="trackInput"
                    placeholder="Enter Order ID or Track ID (e.g. FM710001 / FM-20260912-1A2B3C)"
                >
                <button type="button" class="place-order-btn" onclick="trackOrder()">Track</button>
            </div>
            <div id="trackResult" style="margin-top:12px;"></div>
        </div>

        <div id="ordersContainer">

           <p style="text-align:center;">
                Loading orders...
            </p>

        </div>

        <div style="margin-top:24px;text-align:center;">
            <button type="button" class="place-order-btn" onclick="toggleMyReturns()">📋 My Returns & Replacements</button>
        </div>

        <div id="myReturnsSection" style="display:none;margin-top:24px;">

            <h2 style="text-align:center;">📋 My Returns & Replacements</h2>

            <div id="myReturnsList"><p style="text-align:center;">Loading returns...</p></div>

        </div>

    </section>


    <script src="./api.js"></script>
    <script src="./script.js"></script>

</body>

</html>
