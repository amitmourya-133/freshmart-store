<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>FreshMart - Notifications</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body data-page="notifications">

    <a class="skip-link" href="#main-content">Skip to content</a><header>

        <div class="logo">
            🥬 FreshMart
        </div>

        <div class="header-actions">
            <button
                type="button"
                class="secondary-btn hide-on-mobile-nav"
                data-act="[[&quot;$nav&quot;,&quot;index.html&quot;]]"
            >
                🏠 Home
            </button>
            <div class="auth-area" id="authArea"></div>
            <button
                type="button"
                class="dark-mode-toggle"
                id="darkModeToggle"
                data-act="[[&quot;toggleDarkMode&quot;,[]]]"
                title="Toggle Dark Mode" aria-label="Toggle dark mode"
            >
                🌙
            </button>
        </div>

    </header>


    <section class="orders-page" id="main-content">

        <h1>🔔 Notifications</h1>

        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0;">
            <button type="button" class="secondary-btn" data-act="[[&quot;markAllReadFromPage&quot;,[]]]" id="markAllBtn">✔ Mark all as read</button>
            <span id="notifSummary" style="color:var(--text-secondary);"></span>
        </div>

        <div id="notificationsContainer">
            <p style="text-align:center;">Loading notifications...</p>
        </div>

    </section>


    <script src="./api.js"></script>
    <script src="./script.js"></script>
    <script src="./notifications.js"></script>

</body>

</html>
