<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - My Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <a href="index.html">FreshMart</a>
                </div>
                <div class="auth-area" id="authArea">
                    <!-- Will be populated by script.js -->
                </div>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="profile-page">
            <div class="profile-header">
                <h1>My Profile</h1>
                <a href="index.html" class="back-btn">← Back to Home</a>
            </div>

            <div class="profile-card">
                <!-- Profile section -->
                <div class="profile-section" id="profileSection">
                    <div class="profile-image">
                        <svg width="120" height="120" viewBox="0 0 24 24" fill="none" stroke="#159447" stroke-width="3">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M8 14s1.5 2 4 2 4-2 4-2"/>
                            <line x1="9" y1="9" x2="9.01" y2="9"/>
                            <line x1="15" y1="9" x2="15.01" y2="9"/>
                            <line x1="9" y1="15" x2="9.01" y2="15"/>
                            <line x1="15" y1="15" x2="15.01" y2="15"/>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <div class="user-name" id="userName"></div>
                        <div class="user-email" id="userEmail"></div>
                        <div class="user-phone" id="userPhone"></div>
                    </div>
                </div>

                <!-- Edit profile button -->
                <button class="edit-btn" onclick="toggleEdit(true)">Edit Profile</button>
            </div>

            <!-- Edit form (hidden by default, shown on edit button click) -->
            <div class="edit-form" id="editForm" style="display:none;">
                <h2>Edit Profile</h2>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" class="input-field" placeholder="Full name">
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone</label>
                        <input type="tel" id="phone" class="input-field" placeholder="Phone number">
                    </div>
                    
                    <div class="form-group">
                        <label for="newPassword">New Password (leave blank to keep current)</label>
                        <input type="password" id="newPassword" class="input-field" placeholder="Enter new password">
                    </div>
                    
                    <button type="submit" class="save-btn">Save Changes</button>
                    <button type="button" onclick="toggleEdit(false)" class="cancel-btn">Cancel</button>
                </form>
            </div>

            <!-- Addresses section -->
            <div class="profile-section" id="addressesSection" style="margin-top:32px;">
                <h2>Saved Addresses</h2>
                
                <div id="addressesList">
                    <!-- Addresses will be loaded by script.js -->
                </div>
                
                <button class="add-address-btn" onclick="toggleAddressForm(true)">Add New Address</button>
            </div>

            <!-- Address form (modal-like) -->
            <div class="address-form" id="addressForm" style="display:none; margin-top:16px;">
                <h3 id="addressFormTitle">Add New Address</h3>
                <form id="addressFormElem">
                    <input type="hidden" id="addressIndex">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="addrName" class="input-field" placeholder="e.g. Home">
                        </div>
                        <div class="form-group">
                            <label>Phone</label>
                            <input type="tel" id="addrPhone" class="input-field" placeholder="e.g. 9876543210">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>House/Building</label>
                            <input type="text" id="addrHouse" class="input-field" placeholder="e.g. 123 Main St">
                        </div>
                        <div class="form-group">
                            <label>Street</label>
                            <input type="text" id="addrStreet" class="input-field" placeholder="e.g. Main Street">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>Landmark</label>
                            <input type="text" id="addrLandmark" class="input-field" placeholder="e.g. Near Park">
                        </div>
                        <div class="form-group">
                            <label>City</label>
                            <input type="text" id="addrCity" class="input-field" placeholder="e.g. Mumbai">
                        </div>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label>State</label>
                            <select id="addrState" class="input-field">
                                <option value="">Select state</option>
                                <option value="Maharashtra">Maharashtra</option>
                                <option value="Delhi NCR">Delhi NCR</option>
                                <option value="Gujarat">Gujarat</option>
                                <option value="UP">Uttar Pradesh</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Tamil Nadu">Tamil Nadu</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Kerala">Kerala</option>
                                <option value="Rajasthan">Rajasthan</option>
                                <option value="West Bengal">West Bengal</option>
                                <option value="Himachal Pradesh">Himachal Pradesh</option>
                                <option value="Punjab">Punjab</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Pincode</label>
                            <input type="text" id="addrPincode" class="input-field" placeholder="6 digits (e.g. 400001)">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Delivery Instructions</label>
                        <textarea id="addrInstructions" class="input-field" placeholder="e.g. Leave at door or with neighbor"></textarea>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="save-btn" id="addressSaveBtn">Save Address</button>
                        <button type="button" onclick="toggleAddressForm(false)" class="cancel-btn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 FreshMart. All rights reserved.</p>
            <p>Fresh vegetables, fruits and groceries delivered to your door</p>
        </div>
    </footer>

    <script src="api.js"></script>
    <script src="script.js"></script>
    <script>
        // ===============================
        // PROFILE PAGE (real backend: /api/users/me)
        // Session is the httpOnly cookie — no Authorization header needed.
        // ===============================

        var profileUser = null;
        var editingAddressIndex = -1;

        function esc(val) {
            return String(val == null ? "" : val).replace(/[&<>"']/g, function(ch) {
                return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
            });
        }

        function initProfile() {
            apiGetMe().then(function(user) {
                profileUser = user;
                document.getElementById("userName").textContent = user.name || "FreshMart Customer";
                document.getElementById("userEmail").textContent = user.email || "";
                document.getElementById("userPhone").textContent = user.phone ? ("📞 " + user.phone) : "";
                renderAddresses(user.addresses || []);
            }).catch(function(err) {
                if (typeof showToast === "function") showToast((err && err.message) || "Could not load profile.", "error");
            });
        }

        function toggleEdit(show) {
            var form = document.getElementById("editForm");
            if (form) form.style.display = show ? "block" : "none";
            if (show && profileUser) {
                document.getElementById("name").value = profileUser.name || "";
                document.getElementById("phone").value = profileUser.phone || "";
                document.getElementById("newPassword").value = "";
            }
        }

        var profileForm = document.getElementById("profileForm");
        if (profileForm) {
            profileForm.addEventListener("submit", function(e) {
                e.preventDefault();
                var body = {
                    name: String(document.getElementById("name").value || "").trim(),
                    phone: String(document.getElementById("phone").value || "").trim()
                };
                var pw = document.getElementById("newPassword").value;
                if (pw) {
                    if (pw.length < 6) {
                        if (typeof showToast === "function") showToast("Password must be at least 6 characters.", "error");
                        return;
                    }
                    body.password = pw;
                }
                fetch(API.base + "/users/me", {
                    method: "PUT",
                    headers: getAuthHeaders(),
                    body: JSON.stringify(body)
                })
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (!data.success) throw new Error(data.message || "Update failed");
                    profileUser = data.data;
                    document.getElementById("userName").textContent = profileUser.name || "FreshMart Customer";
                    document.getElementById("userPhone").textContent = profileUser.phone ? ("📞 " + profileUser.phone) : "";
                    toggleEdit(false);
                    if (typeof showToast === "function") showToast("Profile updated successfully.", "success");
                    if (typeof refreshAuthProfile === "function") refreshAuthProfile();
                })
                .catch(function(err) {
                    if (typeof showToast === "function") showToast((err && err.message) || "Could not update profile.", "error");
                });
            });
        }

        function renderAddresses(addresses) {
            var list = document.getElementById("addressesList");
            if (!list) return;
            if (!addresses || addresses.length === 0) {
                list.innerHTML = '<p style="color:#888;">No saved addresses yet. Add one to speed up checkout.</p>';
                return;
            }
            list.innerHTML = addresses.map(function(addr, i) {
                var lines = [
                    (addr.house || "") + (addr.street ? ", " + addr.street : ""),
                    [addr.city, addr.state].filter(Boolean).join(", "),
                    addr.pincode || ""
                ].filter(Boolean).join(" · ");
                return '<div class="profile-address" style="border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:10px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                        '<strong>' + esc(addr.name || "Address " + (i + 1)) + (addr.isDefault ? ' <span style="color:#159447;">(Default)</span>' : '') + '</strong>' +
                        (addr.phone ? '<span style="color:#666;">' + esc(addr.phone) + '</span>' : '') +
                    '</div>' +
                    '<div style="color:#555;margin:4px 0 8px;">' + esc(lines) + '</div>' +
                    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
                        (!addr.isDefault ? '<button type="button" class="secondary-btn" onclick="setDefaultAddress(' + i + ')">Make Default</button>' : '') +
                        '<button type="button" class="secondary-btn" onclick="editAddress(' + i + ')">Edit</button>' +
                        '<button type="button" class="secondary-btn" style="color:#e74c3c;" onclick="deleteAddress(' + i + ')">Delete</button>' +
                    '</div>' +
                '</div>';
            }).join("");
        }

        function updateAddresses(nextAddresses) {
            return fetch(API.base + "/users/me", {
                method: "PUT",
                headers: getAuthHeaders(),
                body: JSON.stringify({ addresses: nextAddresses })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (!data.success) throw new Error(data.message || "Save failed");
                profileUser = data.data;
                renderAddresses(profileUser.addresses || []);
                return data.data;
            });
        }

        function toggleAddressForm(show, index) {
            editingAddressIndex = (typeof index === "number") ? index : -1;
            var form = document.getElementById("addressForm");
            if (!form) return;
            form.style.display = show ? "block" : "none";
            document.getElementById("addressFormTitle").textContent = (editingAddressIndex >= 0 ? "Edit Address" : "Add New Address");
            if (!show) return;

            var src = { name: "", phone: "", house: "", street: "", landmark: "", city: "", state: "", pincode: "", deliveryInstructions: "" };
            if (editingAddressIndex >= 0 && profileUser && profileUser.addresses && profileUser.addresses[editingAddressIndex]) {
                src = profileUser.addresses[editingAddressIndex];
            }
            document.getElementById("addrName").value = src.name || "";
            document.getElementById("addrPhone").value = src.phone || "";
            document.getElementById("addrHouse").value = src.house || "";
            document.getElementById("addrStreet").value = src.street || "";
            document.getElementById("addrLandmark").value = src.landmark || "";
            document.getElementById("addrCity").value = src.city || "";
            document.getElementById("addrState").value = src.state || "";
            document.getElementById("addrPincode").value = src.pincode || "";
            document.getElementById("addrInstructions").value = src.deliveryInstructions || "";
        }

        var addressFormElem = document.getElementById("addressFormElem");
        if (addressFormElem) {
            addressFormElem.addEventListener("submit", function(e) {
                e.preventDefault();
                if (!profileUser) return;
                var addr = {
                    name: document.getElementById("addrName").value.trim(),
                    phone: document.getElementById("addrPhone").value.trim(),
                    house: document.getElementById("addrHouse").value.trim(),
                    street: document.getElementById("addrStreet").value.trim(),
                    landmark: document.getElementById("addrLandmark").value.trim(),
                    city: document.getElementById("addrCity").value.trim(),
                    state: document.getElementById("addrState").value,
                    pincode: document.getElementById("addrPincode").value.trim(),
                    deliveryInstructions: document.getElementById("addrInstructions").value.trim()
                };
                if (!/^\d{6}$/.test(addr.pincode)) {
                    if (typeof showToast === "function") showToast("Please enter a valid 6-digit pincode.", "error");
                    return;
                }
                var list = (profileUser.addresses || []).slice();
                if (editingAddressIndex >= 0 && list[editingAddressIndex]) {
                    list[editingAddressIndex] = addr;
                } else {
                    if (list.length === 0) addr.isDefault = true;
                    list.push(addr);
                }
                updateAddresses(list)
                    .then(function() {
                        toggleAddressForm(false);
                        if (typeof showToast === "function") showToast("Address saved.", "success");
                    })
                    .catch(function(err) {
                        if (typeof showToast === "function") showToast((err && err.message) || "Could not save address.", "error");
                    });
            });
        }

        function editAddress(index) { toggleAddressForm(true, index); }

        function deleteAddress(index) {
            if (typeof confirm === "function" && !confirm("Delete this address?")) return;
            fetch(API.base + "/users/me", {
                method: "PUT",
                headers: getAuthHeaders(),
                body: JSON.stringify({ deleteAddressIndex: index })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (!data.success) throw new Error(data.message || "Delete failed");
                profileUser = data.data;
                renderAddresses(profileUser.addresses || []);
                if (typeof showToast === "function") showToast("Address deleted.", "success");
            })
            .catch(function(err) {
                if (typeof showToast === "function") showToast((err && err.message) || "Could not delete address.", "error");
            });
        }

        function setDefaultAddress(index) {
            fetch(API.base + "/users/me", {
                method: "PUT",
                headers: getAuthHeaders(),
                body: JSON.stringify({ setDefaultIndex: index })
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (!data.success) throw new Error(data.message || "Update failed");
                profileUser = data.data;
                renderAddresses(profileUser.addresses || []);
                if (typeof showToast === "function") showToast("Default address updated.", "success");
            })
            .catch(function(err) {
                if (typeof showToast === "function") showToast((err && err.message) || "Could not update address.", "error");
            });
        }
    </script>
</body>
</html>
