<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Vegetables, Fruits & Groceries - FreshMart</title>
    <meta name="description" content="Browse fresh vegetables, fruits and groceries at FreshMart with prices per unit and fast home delivery.">
    <link rel="canonical" href="https://freshmartstore.in/product-detail.html">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#159447">
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="FreshMart">
    <meta property="og:title" content="Fresh Vegetables, Fruits & Groceries - FreshMart">
    <meta property="og:description" content="Fresh produce and groceries with fast home delivery at fair prices.">
    <meta property="og:url" content="https://freshmartstore.in/product-detail.html">
    <script type="application/ld+json" id="product-jsonld">
    {
      "@context": "https://schema.org",
      "@type": "Product",
      "name": "FreshMart Produce & Groceries",
      "description": "Fresh vegetables, fruits and groceries with prices per unit.",
      "offers": { "@type": "Offer", "priceCurrency": "INR" }
    }
    </script>
    <link rel="stylesheet" href="style.css">
    <script defer src="local-seo.js"></script>
</head>

<body data-page="detail">

<a class="skip-link" href="#main-content">Skip to content</a><header>
    <div class="logo">🥬 FreshMart</div>

    <div class="header-actions">
        <button type="button" class="secondary-btn" onclick="window.location.href='orders.html'">My Orders</button>
        <button type="button" class="secondary-btn" onclick="window.location.href='index.html'">← Back to Shop</button>
        <button type="button" class="dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()" title="Toggle Dark Mode" aria-label="Toggle dark mode">🌙</button>
        <button type="button" class="cart-btn" onclick="openCart()">
            🛒 Cart <span id="cartCount">0</span>
        </button>
    </div>
</header>

<div id="main-content"></div>
<div id="productDetail" class="detail-container">
    <!-- Product detail rendered by JavaScript -->
</div>

<!-- CART MODAL -->
<div id="cartModal" class="cart-modal" role="dialog" aria-modal="true" aria-label="Your cart">
    <div class="cart-content">
        <button type="button" class="close-btn" onclick="closeCart()">✕</button>
        <h2>🛒 Your Cart</h2>
<div id="cartItems"></div>
        <h3 id="cartTotal">Total: ₹10</h3>
        <div id="minOrderNoteCart" class="min-order-note" style="display:none;"></div>
        <button type="button" class="checkout-btn" onclick="proceedToCheckout()">Proceed To Checkout</button>
    </div>
</div>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
