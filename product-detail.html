<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Detail - FreshMart</title>
    <link rel="stylesheet" href="style.css">
</head>

<body data-page="detail">

<header>
    <div class="logo">🥬 FreshMart</div>

    <div class="header-actions">
        <button type="button" class="secondary-btn hide-on-mobile-nav" onclick="window.location.href='orders.html'">My Orders</button>
        <button type="button" class="secondary-btn" onclick="window.location.href='index.html'">← Back to Shop</button>
        <button type="button" class="dark-mode-toggle" id="darkModeToggle" onclick="toggleDarkMode()" title="Toggle Dark Mode">🌙</button>
        <button type="button" class="cart-btn" onclick="openCart()">
            🛒 Cart <span id="cartCount">0</span>
        </button>
    </div>
</header>

<div id="productDetail" class="detail-container">
    <!-- Product detail rendered by JavaScript -->
</div>

<!-- CART MODAL -->
<div id="cartModal" class="cart-modal">
    <div class="cart-content">
        <button type="button" class="close-btn" onclick="closeCart()">✕</button>
        <h2>🛒 Your Cart</h2>
<div id="cartItems"></div>
        <h3 id="cartTotal">Total: ₹10</h3>
        <div id="minOrderNoteCart" class="min-order-note" style="display:none;"></div>
        <button type="button" class="checkout-btn" onclick="proceedToCheckout()">Proceed To Checkout</button>
    </div>
</div>

    <script src="api.js"></script>
    <script src="script.js"></script>
</body>
</html>
